<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Record Editor - Mood Mark</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#bcc9c6",
                        "secondary-fixed": "#d9e3f7",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#121c2a",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#ffb59a",
                        "outline": "#6d7a77",
                        "on-background": "#141b2b",
                        "tertiary-container": "#b05e3d",
                        "surface-container-low": "#f1f3ff",
                        "surface-variant": "#dce2f7",
                        "surface-container-high": "#e1e8fd",
                        "surface-container-highest": "#dce2f7",
                        "primary-fixed-dim": "#6bd8cb",
                        "on-primary-fixed": "#00201d",
                        "on-secondary-container": "#596374",
                        "tertiary": "#924628",
                        "surface-container": "#e9edff",
                        "on-tertiary-container": "#fffbff",
                        "surface-tint": "#006a61",
                        "on-secondary-fixed-variant": "#3d4757",
                        "secondary-container": "#d6e0f4",
                        "on-surface": "#141b2b",
                        "surface-dim": "#d3daef",
                        "secondary": "#555f70",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#bdc7db",
                        "on-error-container": "#93000a",
                        "surface": "#f9f9ff",
                        "on-tertiary-fixed": "#370e00",
                        "inverse-primary": "#6bd8cb",
                        "on-primary-fixed-variant": "#005049",
                        "primary-container": "#008378",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#293040",
                        "on-primary-container": "#f4fffc",
                        "inverse-on-surface": "#edf0ff",
                        "on-surface-variant": "#3d4947",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#ffdbce",
                        "background": "#f9f9ff",
                        "on-tertiary-fixed-variant": "#773215",
                        "on-primary": "#ffffff",
                        "primary": "#00685f",
                        "primary-fixed": "#89f5e7",
                        "surface-bright": "#f9f9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "container-max-width": "1200px",
                        "margin-desktop": "32px",
                        "margin-mobile": "16px",
                        "gutter": "16px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "label-sm": ["Geist"],
                        "headline-lg": ["Geist"],
                        "body-sm": ["Geist"],
                        "body-md": ["Geist"],
                        "headline-sm": ["Geist"],
                        "label-md": ["Geist"],
                        "body-lg": ["Geist"],
                        "headline-md": ["Geist"]
                    },
                    "fontSize": {
                        "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "letterSpacing": "0em", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }],
                        "headline-sm": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #f9f9ff;
            color: #141b2b;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom Scrollbar for Textarea */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent;
        }
        textarea::-webkit-scrollbar-thumb {
            background-color: #dce2f7;
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex min-h-screen bg-surface">
<!-- Suppressed SideNavBar for Transactional/Focused Screen -->
<!-- The Record Editor is a focused form where user attention is critical. Therefore, navigation is hidden to minimize distractions. -->
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Editor Container -->
<div class="w-full max-w-[800px] bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05),0_2px_4px_-1px_rgba(0,0,0,0.03)] flex flex-col overflow-hidden relative">
<!-- Subtle Top Color Bar -->
<div class="h-1 bg-primary w-full absolute top-0 left-0"></div>
<!-- Header Section -->
<div class="px-6 py-5 border-b border-outline-variant flex justify-between items-center bg-surface-bright">
<div>
<h1 class="font-headline-md text-headline-md text-on-surface">New Record</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1" id="unsaved-status">Unsaved changes...</p>
</div>
<button aria-label="Close Editor" class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center w-8 h-8 rounded-full hover:bg-surface-container">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Form Section -->
<form class="flex-1 flex flex-col p-6 gap-6">
<!-- Date & Mood Row -->
<div class="flex flex-col md:flex-row gap-6">
<!-- Date Input -->
<div class="flex-1">
<label class="font-label-md text-label-md text-on-surface flex items-center mb-unit" for="record-date">
                            Date <span class="text-error ml-1">*</span>
</label>
<div class="relative">
<input class="w-full h-9 px-3 py-2 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none font-body-sm text-body-sm text-on-surface transition-colors" id="record-date" name="record-date" required="" type="date"/>
</div>
</div>
<!-- Mood Selection -->
<div class="flex-1">
<label class="font-label-md text-label-md text-on-surface flex items-center mb-unit" for="record-mood">
                            Mood
                        </label>
<div class="relative">
<select class="w-full h-9 px-3 py-2 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none font-body-sm text-body-sm text-on-surface appearance-none transition-colors" id="record-mood" name="record-mood">
<option disabled="" selected="" value="">Select a state...</option>
<option value="excellent">Excellent</option>
<option value="good">Good</option>
<option value="neutral">Neutral</option>
<option value="poor">Poor</option>
<option value="terrible">Terrible</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant text-[20px]">expand_more</span>
</div>
</div>
</div>
<!-- Note Text Area -->
<div class="flex-1 flex flex-col min-h-[300px]">
<div class="flex justify-between items-end mb-unit">
<label class="font-label-md text-label-md text-on-surface flex items-center" for="record-note">
                            Note <span class="text-error ml-1">*</span>
</label>
<!-- Validation Message Placeholder -->
<span class="font-label-sm text-label-sm text-error hidden" id="note-error">Note content is required</span>
</div>
<!-- Textarea with rich feeling -->
<textarea class="w-full flex-1 p-4 bg-surface-bright border border-outline-variant rounded resize-none focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none font-body-md text-body-md text-on-surface transition-colors shadow-inner" id="record-note" name="record-note" placeholder="Start typing your thoughts..." required=""></textarea>
</div>
</form>
<!-- Footer / Action Area -->
<div class="px-6 py-4 bg-surface border-t border-outline-variant flex justify-end gap-3 items-center">
<button class="h-9 px-4 rounded border border-outline-variant bg-surface-container-lowest text-on-surface font-label-md text-label-md hover:bg-surface-container-low transition-colors focus:ring-2 focus:ring-primary focus:outline-none" type="button">
                    Cancel
                </button>
<button class="h-9 px-6 rounded bg-[#0D9488] text-[#ffffff] font-label-md text-label-md hover:bg-[#0f766e] transition-colors focus:ring-2 focus:ring-offset-2 focus:ring-[#0D9488] focus:outline-none flex items-center gap-2 shadow-sm" onclick="validateForm()" type="button">
<span class="material-symbols-outlined text-[18px]">save</span>
                    Save Record
                </button>
</div>
</div>
</main>
<script>
        // Set today's date as default
        document.getElementById('record-date').valueAsDate = new Date();

        const noteInput = document.getElementById('record-note');
        const statusText = document.getElementById('unsaved-status');
        let typingTimer;
        const doneTypingInterval = 1000;

        // Simple typing indicator logic
        noteInput.addEventListener('input', () => {
            clearTimeout(typingTimer);
            statusText.textContent = "Saving draft...";
            statusText.classList.add('text-primary');
            
            typingTimer = setTimeout(() => {
                statusText.textContent = "Draft saved locally";
                statusText.classList.remove('text-primary');
            }, doneTypingInterval);
        });

        function validateForm() {
            const noteValue = document.getElementById('record-note').value.trim();
            const errorMsg = document.getElementById('note-error');
            const noteArea = document.getElementById('record-note');

            if (!noteValue) {
                errorMsg.classList.remove('hidden');
                noteArea.classList.add('border-error');
                noteArea.classList.remove('border-outline-variant');
                noteArea.focus();
            } else {
                errorMsg.classList.add('hidden');
                noteArea.classList.remove('border-error');
                noteArea.classList.add('border-outline-variant');
                // Proceed with save logic
                statusText.textContent = "Saved";
                statusText.classList.remove('text-primary');
            }
        }
    </script>
</body></html>
